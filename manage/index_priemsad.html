<html>
    <head>
    	<meta http-equiv="Content-Type" content="text/html;" charset="utf-8">
		<title>Управление записью</title>
		<script src="https://code.jquery.com/jquery-3.3.1.js"></script>
        <link href="dist/css/datepicker.min.css" rel="stylesheet" type="text/css">
        <script src="dist/js/datepicker.min.js"></script>
        <link href="dist/css/nouislider.min.css" rel="stylesheet" type="text/css">
        <link href="../css/css.css?v=1" rel="stylesheet" type="text/css">

        <script src="dist/js/nouislider.min.js"></script>
        <script src="js/app_secret_admin.js?v=6"></script>
        <style>
        	.date{
    			background-color: #eee;
			    padding: 5px 10px;
			    margin: 5px;
			    display: inline-block;
			    font-size: 12pt;
			    border-radius: 4px;
			    transition: 0.2s;
			    cursor: pointer;

			}
			.date:hover{
			    transition: 0.2s;
			    background-color: #ca0000;
			    color: #ca0000;
			}
			.date:hover:after {
			    transition: 0.2s;

			    content: "удалить";
			    text-align: center;
			    position: absolute;
			    /* top: 10px; */
    			transform: translateX(-67px);
			    /* float: left; */
			    color: white;
			}
			#slider {
   				margin: 50px;
			}
			#SelectedDates{
				display: inline-block;
				width: calc(100% - 300px);
				vertical-align: top;
			}
			.datepicker-inline{
				display: inline-block;
			}
			.add{
				max-width: 600px;
			    text-align: center;
			    margin: auto;
			    display: none;
			    position: absolute;
			    width: 100%;
			    top: 50px;
			    left: 50%;
			    background: #fff;
			    transform: translateX(-50%);
			    z-index: 101;
			}
			#SelectedDatesList{
				text-align: center;
			}
			.titl{
				text-align: center;
				font-size: 16pt;
				margin:20px;
			}
			.noUi-connect {
			    background: #5593e5 !important;
			}
			.datepicker--cell.-selected-, .datepicker--cell.-selected-.-current- {
			    color: #fff;
			    background: #5593e5 !important;
			}
			.xx {
			    color: #ba0000;
			    position: relative;
			    top: -10px;
			    left: 10px;
			    /* background-color: #d0d0d0; */
			    cursor: pointer;
			}
			.ten {
			    position: fixed;
			    top: 0px;
			    left: 0px;
			    width: 100%;
			    height: 100%;
			    background: gray;
			    z-index: 100;
			    opacity: 0.5;
			    display: none;
			}
			.href {
			    cursor: pointer;
			}
			#interval {
			    font-size: inherit;
			}
        </style>
    </head>
    <body>
		<div class="TopHead">
					<select id="urlurl" class="inputField short" onchange="$('.hidedafault').hide();GetUser()">
					<option value="priemsad">Прием в сад</option>
					</select>
					<div>Включая архивные<input type="checkbox" id="arch"></div>
					<button class="bluebutton" onclick="GetUser()">показать</button>

			<h1 id="FIODescr"></h1>
			<h2 id="FIOPost" class="hidedafault">Должность: </h2>
			<h2 id="PlaceDescr"></h2>
		</div>


		<div id="form1">
			
			<div id="DateLists"></div>
			<div id="TimeLists"></div>
			<div id="ButtonPlace"><button class="bluebutton hidedafault" id="addddd" onclick="showAddDate()">Добавить дату</button></div>
		</div>


       	<div class="view">
       		<input type="text" style="display:none" id="url"/>
       	</div>
       	<div class="add">
    		<div class="titl">Выберите даты</div>
    		<div>
    			<input type='text' id="AddDates" style="display:none" data-position="right top" onchange="UpdateDates()" />
    			<div id="SelectedDates"><div>Выбранные даты</div><div id="SelectedDatesList"></div></div>
    		</div>
    		<div class="titl">Выберите промежуток времени.<br>Интервал: 
    			<select id="interval" onchange="setrange()">
    				<option value="10">10 минут</option>
    				<option value="15" selected>15 минут</option>
					<option value="20">20 минут</option>
					<option value="30">30 минут</option>

				</select>
    		</div>
    		<div id="slider"></div>
    		<div class="titl"><button class="bluebutton" id="fuck" onclick="NewDate()">Сохранить</button></div>

       	</div>
       	<div onclick="hidemodal()" class="ten"></div>
       	<div class="loaderdiv"><img src="loader.gif"/></div>
        </body>
</html>
